name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.2"

      - uses: nf-core/setup-nf-test@v1
        with:
          version: "0.9.3"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tools
        run: pip install statsmodels pytest

      - name: Pipeline wiring (stub run)
        run: nextflow run main.nf -profile test -stub -ansi-log false

      - name: nf-test
        run: nf-test test --profile test

      - name: Benchmark CI script on the stub summary
        run: python bin/benchmark_ci.py results/benchmark/HG002.summary.csv

      - name: Drill answer key still passes
        env:
          DRILLS: exercises.solutions.genomics_drills
        run: python -m pytest exercises -q
